name: Keep Render API awake

# Render's free plan puts the API to sleep after 15 minutes without traffic, and the next
# visitor then waits 30-60 s. This pings /api/ping every 10 minutes so it stays awake.
# /api/ping never touches the database, so a scale-to-zero database (Neon) can still
# sleep between real visits instead of burning its free compute hours on these pings.
#
# Setup: Settings > Secrets and variables > Actions > Variables > New repository variable
#   Name:  RENDER_API_URL
#   Value: https://<your-service>.onrender.com   (no trailing slash)
# Then run it once from the Actions tab ("Run workflow") to check.

on:
  schedule:
    - cron: "*/10 * * * *" # UTC; GitHub may start scheduled runs a few minutes late
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the API
        env:
          API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::RENDER_API_URL is not set. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          url="${API_URL%/}/api/ping"
          # A sleeping instance can take up to a minute to boot, so allow long requests and retries.
          for attempt in 1 2 3 4 5; do
            code=$(curl --silent --show-error --output response.json --write-out '%{http_code}' --max-time 90 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Attempt $attempt: awake - $(cat response.json)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code - retrying in 20 s"
            sleep 20
          done
          echo "::error::$url did not respond after 5 attempts (is the Render service down?)"
          exit 1
