<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js). The commands below are queued at once; Google's script itself
         (about 175 KiB) loads on the visitor's first tap, scroll or key press, or 4 seconds after
         the page has loaded, so it doesn't compete with the page. Visits that end within those
         4 seconds without any interaction are not counted. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-7HJT7H03N4');

      (function () {
        var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) { removeEventListener(e, load, true); });
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-7HJT7H03N4';
          document.head.appendChild(script);
        }
        events.forEach(function (e) { addEventListener(e, load, { capture: true, passive: true }); });
        addEventListener('load', function () { setTimeout(load, 4000); });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#102210" />
    <link rel="icon" type="image/webp" href="/Logo.webp" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Title, description and the other search/social tags of each page are written into its
         own page file at build time (plugins/seo.js, from src/seo) and kept up to date in the
         browser (components/Seo.jsx). These are the home page's, for the dev server. -->
    <title>Sumedha Agro | Mushroom Spawn Production &amp; Training, Lucknow</title>
    <meta name="description" content="Quality mushroom spawn, hands-on mushroom cultivation and spawn production training, and value-added mushroom products from Sumedha Agro, Lucknow." data-seo />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
