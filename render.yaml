# Render Blueprint for the API (server/). Render > New > Blueprint > pick this repo.
# Values marked `sync: false` are asked for when the Blueprint is created.
services:
  - type: web
    name: sumedha-agro-api
    runtime: node
    rootDir: server
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/ping # database-free: a brief Atlas hiccup doesn't make Render restart the API
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: mongodb
      - key: MONGODB_URI # MongoDB Atlas connection string (mongodb+srv://…)
        sync: false
      - key: MONGODB_DB
        value: sumedha_agro
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: sumedha-agro
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: COMPANY_EMAIL
        sync: false
